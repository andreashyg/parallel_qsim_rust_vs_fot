global_parameters:
  global_log_file_pattern: "{base_output_dir}/{experiment_set_name}/global_log.txt"
  global_error_log_file_pattern: "{base_output_dir}/{experiment_set_name}/global_error_log.txt"
  output_expset_config_pattern: "{base_output_dir}/{experiment_set_name}/output_expset_config.yaml"
  output_global_config_pattern: "{base_output_dir}/{experiment_set_name}/output_global_config.yaml"
  # used in the GNU parallel call, i.e., "--joblog <joblog_path>", to make parallel store a joblog.
  # This is used to allow resuming the runs if they are interrupted, and to allow extracting measurements from the runs
  # without having to rerun them. MUST INCLUDE {module_id}, since the joblog is per module, and needs a unique name per module
  # (even if the same module is used multiple times in the same experiment set, e.g., with different parameters).
  joblog_path_pattern: "{base_output_dir}/{experiment_set_name}/joblogs/{module_id}_parallel_job.log"

  # this is where parallel writes the individual stdout and stderr of each parallel job. This is important, since the output
  # of multiple parallel jobs is mixed together in the stdout and stderr of the main process
  results_dir_pattern: "{base_output_dir}/{experiment_set_name}/individual-output/beta{1}-use-random{3}/{module_id}/"

  # FIXME it is not correct that the dresden scenario is in the compare_braess_to_java folder. But this is where the bash scripts are, which is wrong as well
  original_dir_to_read_from: "./../../public-svn/matsim/scenarios/countries/de/dresden/dresden-v1.1/calibrated-1pct/output"
  file_name_end_pattern_with_beta_rr_ur: "Beta{beta}UseRandomSeed{use_random_seed}" # Note: read_from_random is not present in this scenario
  file_name_end_pattern_with_beta_rr: "Beta{beta}" # Note: read_from_random is not present in this scenario
  file_name_end_pattern_with_beta: "Beta{beta}"
  # Note: the below pattern is the complete output dir, not just the start, since the common part is in fact all of it
  common_output_from_runs_pattern: "{base_output_dir}/{experiment_set_name}/outputFromRuns/beta{beta}/useRandomSeed{use_random_seed}"
  common_extracted_data_pattern: "{base_output_dir}/{experiment_set_name}/analysis/extractedData"
  common_plots_pattern: "{base_output_dir}/{experiment_set_name}/analysis/plots"

  pop_to_use_as_input_pattern: "{original_dir_to_read_from}/009.output_plans.xml.gz"
  vehicle_file_pattern: "{original_dir_to_read_from}/009.output_vehicles.xml.gz"
  network_file_pattern: "{original_dir_to_read_from}/009.output_network.xml.gz"
  facilities_file_pattern: "{original_dir_to_read_from}/009.output_facilities.xml.gz"
  transit_schedule_file_pattern: "{original_dir_to_read_from}/009.output_transitSchedule.xml.gz"
  transit_vehicles_file_pattern: "{original_dir_to_read_from}/009.output_transitVehicles.xml.gz"
  scoring_parameters_file_pattern: "./runners/dresden_scoring_parameters.yaml"

  standard_fig_size: [ 12, 10 ]
  boxplot_fig_size: [ 12, 12 ]
  scatterplot_fig_size: [ 12, 8 ]