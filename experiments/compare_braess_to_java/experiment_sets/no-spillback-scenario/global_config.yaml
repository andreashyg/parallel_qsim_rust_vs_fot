global_parameters:
  global_log_file_pattern: "{base_output_dir}/{experiment_set_name}/global_log.txt"
  global_error_log_file_pattern: "{base_output_dir}/{experiment_set_name}/global_error_log.txt"
  output_expset_config_pattern: "{base_output_dir}/{experiment_set_name}/output_expset_config.yaml"
  output_global_config_pattern: "{base_output_dir}/{experiment_set_name}/output_global_config.yaml"
  # used in the GNU parallel call, i.e., "--joblog <joblog_path>", to make parallel store a joblog.
  # This is used to allow resuming the runs if they are interrupted, and to allow extracting measurements from the runs
  # without having to rerun them. MUST INCLUDE {callback}, since the joblog is per callback
  joblog_path_pattern: "{base_output_dir}/{experiment_set_name}/joblogs/{callback}_parallel_job.log"

  # this is where parallel writes the individual stdout and stderr of each parallel job. This is important, since the output
  # of multiple parallel jobs is mixed together in the stdout and stderr of the main process
  results_dir_pattern: "{base_output_dir}/{experiment_set_name}/individual-output/beta{1}-read-from-random{2}-use-random{3}/"

  original_dir_to_read_from: "./../../runs-svn/braess/refinement/no_spillback_scenario"
  file_name_end_pattern_with_beta_rr_ur: "Beta{beta}ReadFromRandom{read_from_random}UseRandomSeed{use_random_seed}"
  file_name_end_pattern_with_beta_rr: "Beta{beta}ReadFromRandom{read_from_random}"
  file_name_end_pattern_with_beta: "Beta{beta}"
  # Note: the below pattern is the complete output dir, not just the start, since the common part is in fact all of it
  common_output_from_runs_pattern: "{base_output_dir}/{experiment_set_name}/outputFromRuns/beta{beta}/readFromRandom{read_from_random}useRandomSeed{use_random_seed}"
  common_extracted_data_pattern: "{base_output_dir}/{experiment_set_name}/analysis/extractedData"
  common_plots_pattern: "{base_output_dir}/{experiment_set_name}/analysis/plots"

  vehicle_file_pattern: "{original_dir_to_read_from}/no_spillback_beta{beta}_vehicles.xml"
  network_file_pattern: "{original_dir_to_read_from}/no_spillback_network.xml"

  standard_fig_size: [ 12, 10 ]
  boxplot_fig_size: [ 12, 12 ]
  scatterplot_fig_size: [ 12, 8 ]

  nash_tt_points: [ [ 0, 25 ], [ 15, 55 ], [ 26.25, 66.25 ], [ 82.5, 85 ], [ 100, 85 ] ]

  nash_sd_points: [ [ [ 0, 0 ], [ 15, 0 ], [ 26.25, 0 ], [ 82.5, 18.75 ], [ 100, 27.5 ] ],  # top
                    [ [ 0, 0 ], [ 15, 15 ], [ 26.25, 18.75 ], [ 82.5, 37.5 ], [ 100, 37.5 ] ],  # middle
                    [ [ 0, 0 ], [ 15, 0 ], [ 26.25, 7.5 ], [ 82.5, 26.25 ], [ 100, 35 ] ] ]  # bottom

  # These are used when replacing activity times in the original java output plans with the correct activity times
  #  original_output_pop_pattern: "{original_dir_to_read_from}/beta{beta}/random{read_from_random}/beta{beta}random{read_from_random}.output_plans.xml.gz"
  #  pop_with_correct_activity_times_pattern: "{original_dir_to_read_from}/uniteratedPlans_TimeFormatHHMMSSDOTSS/beta{beta}random1.output_plans.xml.gz"
  #  vehicle_file_pattern: "{original_dir_to_read_from}/no_spillback_beta{beta}_vehicles.xml"
  # This is the population that will be used when performing runs based on output plans. That is, the original java
  # output plans, but with the activity times replaced with the correct ones.
  #  pop_to_use_as_input_pattern: "{original_dir_to_read_from}/beta{beta}/random{read_from_random}/beta{beta}random{read_from_random}.output_plans.xml.zst"
  # USE WITH CAUTION: Use this line to use population without added access/egress legs (make sure that the corresponding line is commented out in the population preparer)
  #  pop_to_use_as_input_pattern: "{base_output_dir}/commonData/popsWithFixedActivityTimesWithoutLegs/beta{beta}/beta{beta}random{read_from_random}.output_plans.xml.gz"

  # This is for running runs based on original java output plans in java:
#  original_output_config_pattern: "{original_dir_to_read_from}/beta{beta}/random{read_from_random}/beta{beta}random{read_from_random}.output_config.xml"