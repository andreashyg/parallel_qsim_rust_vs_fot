# Setup
globals:
  experiment_set_name: analyzing-java-output-original-settings
  base_output_dir: ./../../runs-svn/Abschlussarbeiten/2026/andreas-hygrell-rust-vs-fot/compare-braess-to-java/no-spillback-scenario
  max_parallel_jobs: 0
  # For clarity, add the reformatted_original_java_data to the pattern, so it is clear that these are not the extracted
  # measurements
  tt_csv_path_pattern: "{common_extracted_data_pattern}/averageRouteTtsPerDeptime{file_name_end}.csv"
  sd_csv_path_pattern: "{common_extracted_data_pattern}/summedDepsPerTime{file_name_end}.csv"

param_sweep:
  betas: [ 1, 2, 4, 8 ]
  read_from_random_seed_indices: [ 1 ]
  use_random_seeds: [ None ]

# What to actually run in this experiment set:
modules:

  # extract measurements from the events files
  - extract_measurements_from_events:
    type: ExtractMeasurementsFromEvents
    input_file_stem_pattern: "{original_dir_to_read_from}/2026-10-19-18-16-35_original_settings_to_beta_8/beta{beta}/random{read_from_random}/beta{beta}random{read_from_random}.output_events"
    input_file_format: xml.zst
    num_parts: 0

  # plot the measurements
  - plot_tt_and_sd_per_seed:
    type: PlotTtAndSdPerSeed
    sd_ylims: [ 0.0, 45.0 ]
    tt_ylims: [ 0.0, 110.0 ]
  - plot_tt_and_sd_avgd_over_seeds:
    type: PlotTtAndSdAvgdOverSeeds
    sd_ylims: [ 0.0, 45.0 ]
    tt_ylims: [ 0.0, 110.0 ]
    seeds_to_avg_over: ReadFromRandomSeedIndices
  - plot_tt_and_sd_deviation_to_nash_boxplots:
    type: PlotTtAndSdDeviationToNashBoxplotsOverBeta
    seeds_to_avg_over: ReadFromRandomSeedIndices
    sd_ylims: [ 0.0, 3.5 ]
    tt_ylims: [ 0.0, 8.5 ]
  - plot_tt_and_sd_deviation_to_nash_scatterplots:
    type: PlotTtAndSdDeviationToNashScatterplotsOverBeta
    seeds_to_avg_over: ReadFromRandomSeedIndices
    sd_ylims: [ 0.0, 0.45 ]
    tt_ylims: [ 0.0, 1.05 ]

  # Plot the differences per seed to theresas runs (of course also with original settings)
  - plot_tt_and_sd_diff_to_theresas_runs_per_seed:
    type: PlotTtAndSdDiffPerSeed
    minus_what: "TheresasRuns"
    sd_ylims: [ -1.0, 1.0 ]
    tt_ylims: [ -3.3, 4.7 ]
    secondary_input_tt_csv_path_pattern: "{base_output_dir}/analyzing-theresas-java-output-original-settings/analysis/extractedData/averageRouteTtsPerDeptime{file_name_end}ReformattedTheresasData.csv"
    secondary_input_sd_csv_path_pattern: "{base_output_dir}/analyzing-theresas-java-output-original-settings/analysis/extractedData/summedDepsPerTime{file_name_end}ReformattedTheresasData.csv"